<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
  <div class="card">
    <div class="image">
      <img src="https://www.shutterstock.com/image-photo/head-shot-portrait-close-smiling-600nw-1714666150.jpg"
        alt="profile img" class="profile-image">
    </div>
    <div class="text-data">
      <span class="name">CodeWithVansh</span>
      <span class="job">Web Developer</span>
    </div>
    <div class="media-button">
      <a href="#" class="link link1">
        <i class='bx bxl-facebook'></i>
      </a>
      <a href="#" class="link link2">
        <i class='bx bxl-linkedin'></i>
      </a>
      <a href="#" class="link link3">
        <i class='bx bxl-instagram'></i>
      </a>
      <a href="#" class="link link4">
        <i class='bx bxl-github'></i>
      </a>
    </div>
    <div class="buttons">
      <button class="button">Visit</button>
      <button class="button">Message</button>
    </div>
    <div class="analytics">
      <div class="data">
        <i class='bx bx-heart'></i>
        <span class="number">2K</span>
      </div>
      <div class="data">
        <i class='bx bxs-message-dots'></i>
        <span class="number">5K</span>
      </div>
      <div class="data">
        <i class='bx bx-share'></i>
        <span class="number">4k</span>
      </div>
    </div>
  </div>
</body>

</html>
